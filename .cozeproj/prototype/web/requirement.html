<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-primary:              #3B82F6;
      --color-primary-container:    #1E3A5F;
      --color-on-primary:           #ffffff;
      --color-background:                 #0F1115;
      --color-surface-container-lowest:   #0F1115;
      --color-surface:                    #1A1D24;
      --color-surface-container:          #252830;
      --color-surface-container-high:     #2A2D35;
      --color-surface-container-highest:  #32363F;
      --color-on-surface:           #FFFFFF;
      --color-on-surface-variant:   #9CA3AF;
      --color-success:  #10B981;
      --color-error:    #EF4444;
      --color-warning:  #F59E0B;
      --color-outline:          #374151;
      --color-outline-variant:  #4B5563;
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      --shadow-card:   0 2px 8px rgba(0,0,0,0.15);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.2);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.3);
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }
  </style>

  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start -->
  <header class="bg-surface sticky top-0 z-40 h-14 flex items-center justify-between px-5 border-b border-outline/20">
    <div class="flex items-center gap-2.5">
      <i data-lucide="cpu" class="text-primary w-5 h-5"></i>
      <span class="font-bold text-base tracking-tight">Harness Platform</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs text-on-surface-variant font-mono">v0.1.0</span>
      <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center text-primary text-xs font-bold">初</div>
    </div>
  </header>

  <div class="flex" style="height: calc(100vh - 3.5rem)">
    <aside class="w-52 shrink-0 bg-surface border-r border-outline/20 overflow-y-auto">
      <div class="p-3 space-y-0.5">
        <a href="requirement.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md bg-primary/10 text-primary font-medium text-sm" aria-current="page">
          <i data-lucide="message-square-plus" class="w-4 h-4"></i>需求输入
        </a>
        <a href="pipeline.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="git-branch" class="w-4 h-4"></i>流程监控
        </a>
        <a href="constraints.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="shield-check" class="w-4 h-4"></i>约束配置
        </a>
        <a href="artifacts.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="package" class="w-4 h-4"></i>产物管理
        </a>
      </div>
    </aside>

    <!-- @main-content:start -->
    <main class="flex-1 min-w-0 overflow-y-auto bg-background p-6">
      <div class="max-w-3xl mx-auto space-y-8">
        <!-- 页面标题 -->
        <div>
          <h1 class="text-2xl font-bold">需求输入</h1>
          <p class="text-sm text-on-surface-variant mt-1">描述你想要构建的应用，Harness Agent 将按 8 阶段流程生成可部署代码</p>
        </div>

        <!-- 需求输入区 -->
        <div class="bg-surface rounded-lg shadow-card p-5 space-y-4">
          <label class="block">
            <span class="text-sm font-semibold text-on-surface">应用需求描述</span>
            <textarea id="requirement-input" rows="8" class="mt-1.5 w-full bg-surface-container border-none rounded-md px-3 py-2.5 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors resize-none font-sans leading-relaxed" placeholder="例如：开发一个团队任务管理应用，支持看板视图、任务分配、截止日期提醒、文件附件和评论功能。使用 React + Node.js 技术栈，需要 PostgreSQL 持久化。"></textarea>
          </label>

          <div class="flex items-center justify-between">
            <span class="text-xs text-on-surface-variant">建议 50-500 字，包含功能、技术栈偏好和非功能需求</span>
            <span id="char-count" class="text-xs text-on-surface-variant font-mono">0 / 500</span>
          </div>
        </div>

        <!-- 技术栈模板选择 -->
        <div class="bg-surface rounded-lg shadow-card p-5 space-y-3">
          <span class="text-sm font-semibold text-on-surface">技术栈模板</span>
          <div class="grid grid-cols-2 gap-3" id="tech-stack-grid">
            <button id="stack-react-fastapi" class="group flex flex-col items-start gap-1.5 p-4 rounded-lg border border-outline/20 hover:border-primary/40 hover:bg-primary/5 transition-all cursor-pointer">
              <div class="flex items-center gap-2">
                <i data-lucide="layout-grid" class="w-4 h-4 text-primary"></i>
                <span class="text-sm font-semibold text-on-surface">React + FastAPI</span>
              </div>
              <span class="text-xs text-on-surface-variant">Vite + TypeScript + Python + LangGraph</span>
            </button>

            <button id="stack-next-prisma" class="group flex flex-col items-start gap-1.5 p-4 rounded-lg border border-outline/20 hover:border-primary/40 hover:bg-primary/5 transition-all cursor-pointer">
              <div class="flex items-center gap-2">
                <i data-lucide="hexagon" class="w-4 h-4 text-on-surface-variant"></i>
                <span class="text-sm font-semibold text-on-surface">Next.js + Prisma</span>
              </div>
              <span class="text-xs text-on-surface-variant">App Router + PostgreSQL + tRPC</span>
            </button>

            <button id="stack-taro-miniprogram" class="group flex flex-col items-start gap-1.5 p-4 rounded-lg border border-outline/20 hover:border-primary/40 hover:bg-primary/5 transition-all cursor-pointer">
              <div class="flex items-center gap-2">
                <i data-lucide="smartphone" class="w-4 h-4 text-on-surface-variant"></i>
                <span class="text-sm font-semibold text-on-surface">Taro 小程序</span>
              </div>
              <span class="text-xs text-on-surface-variant">React + 微信/抖音多端</span>
            </button>

            <button id="stack-custom" class="group flex flex-col items-start gap-1.5 p-4 rounded-lg border border-outline/20 hover:border-primary/40 hover:bg-primary/5 transition-all cursor-pointer">
              <div class="flex items-center gap-2">
                <i data-lucide="settings-2" class="w-4 h-4 text-on-surface-variant"></i>
                <span class="text-sm font-semibold text-on-surface">自定义</span>
              </div>
              <span class="text-xs text-on-surface-variant">手动指定前后端技术栈</span>
            </button>
          </div>
        </div>

        <!-- 约束预配置 -->
        <div class="bg-surface rounded-lg shadow-card p-5 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-on-surface">约束预配置</span>
            <button id="btn-advanced-config" class="text-xs text-primary hover:underline">高级配置</button>
          </div>
          <div class="space-y-2.5">
            <div class="flex items-center justify-between px-1">
              <div class="flex items-center gap-2">
                <i data-lucide="file-code-2" class="w-3.5 h-3.5 text-on-surface-variant"></i>
                <span class="text-sm text-on-surface">自动生成 AGENTS.md</span>
              </div>
              <div id="toggle-agents-md" class="w-9 h-5 rounded-full bg-primary/30 relative cursor-pointer transition-colors" data-on="true">
                <div class="w-4 h-4 rounded-full bg-primary absolute top-0.5 right-0.5 transition-all"></div>
              </div>
            </div>
            <div class="flex items-center justify-between px-1">
              <div class="flex items-center gap-2">
                <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-on-surface-variant"></i>
                <span class="text-sm text-on-surface">Linter 规则自动注入</span>
              </div>
              <div id="toggle-linter" class="w-9 h-5 rounded-full bg-primary/30 relative cursor-pointer transition-colors" data-on="true">
                <div class="w-4 h-4 rounded-full bg-primary absolute top-0.5 right-0.5 transition-all"></div>
              </div>
            </div>
            <div class="flex items-center justify-between px-1">
              <div class="flex items-center gap-2">
                <i data-lucide="test-tubes" class="w-3.5 h-3.5 text-on-surface-variant"></i>
                <span class="text-sm text-on-surface">覆盖率闸门 ≥ 80%</span>
              </div>
              <div id="toggle-coverage" class="w-9 h-5 rounded-full bg-primary/30 relative cursor-pointer transition-colors" data-on="true">
                <div class="w-4 h-4 rounded-full bg-primary absolute top-0.5 right-0.5 transition-all"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 启动按钮 -->
        <div class="flex items-center gap-3">
          <button id="btn-start" class="bg-primary text-on-primary px-6 py-2.5 rounded-md text-sm font-semibold hover:opacity-90 active:scale-[0.98] transition-all inline-flex items-center gap-2">
            <i data-lucide="play" class="w-4 h-4"></i>启动生成
          </button>
          <button id="btn-draft" class="bg-surface-container text-on-surface border-none px-4 py-2.5 rounded-md text-sm font-medium hover:bg-surface-container-high active:scale-[0.98] transition-all">
            保存草稿
          </button>
        </div>

        <!-- 历史记录 -->
        <div class="space-y-3">
          <span class="text-sm font-semibold text-on-surface">近期生成</span>
          <div class="space-y-2">
            <a href="pipeline.html" class="block bg-surface rounded-lg shadow-card p-4 hover:bg-surface-container/30 transition-colors">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <i data-lucide="check-circle-2" class="w-4 h-4 text-success"></i>
                  <div>
                    <span class="text-sm font-medium text-on-surface">团队任务管理应用</span>
                    <span class="text-xs text-on-surface-variant ml-2">React + FastAPI</span>
                  </div>
                </div>
                <span class="text-xs text-on-surface-variant font-mono">2 小时前</span>
              </div>
            </a>
            <a href="pipeline.html" class="block bg-surface rounded-lg shadow-card p-4 hover:bg-surface-container/30 transition-colors">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <i data-lucide="alert-circle" class="w-4 h-4 text-error"></i>
                  <div>
                    <span class="text-sm font-medium text-on-surface">电商订单管理系统</span>
                    <span class="text-xs text-on-surface-variant ml-2">Next.js + Prisma</span>
                  </div>
                </div>
                <span class="text-xs text-on-surface-variant font-mono">昨天</span>
              </div>
            </a>
            <a href="pipeline.html" class="block bg-surface rounded-lg shadow-card p-4 hover:bg-surface-container/30 transition-colors">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <i data-lucide="check-circle-2" class="w-4 h-4 text-success"></i>
                  <div>
                    <span class="text-sm font-medium text-on-surface">数据看板小程序</span>
                    <span class="text-xs text-on-surface-variant ml-2">Taro 小程序</span>
                  </div>
                </div>
                <span class="text-xs text-on-surface-variant font-mono">3 天前</span>
              </div>
            </a>
          </div>
        </div>
      </div>
    </main>
    <!-- @main-content:end -->
  </div>
  <!-- @nav:end -->

  <script>
    lucide.createIcons();

    $(function() {
      // 字数统计
      $('#requirement-input').on('input', function() {
        const len = $(this).val().length;
        $('#char-count').text(len + ' / 500');
        if (len > 500) {
          $('#char-count').addClass('text-error');
        } else {
          $('#char-count').removeClass('text-error');
        }
      });

      // 技术栈选择
      $('#tech-stack-grid button').on('click', function() {
        $('#tech-stack-grid button').removeClass('border-primary/60 bg-primary/10').addClass('border-outline/20');
        $(this).removeClass('border-outline/20').addClass('border-primary/60 bg-primary/10');
      });
      // 默认选中第一个
      $('#stack-react-fastapi').trigger('click');

      // toggle 开关
      $('[id^="toggle-"]').on('click', function() {
        const isOn = $(this).data('on') === true;
        $(this).data('on', !isOn);
        if (!isOn) {
          $(this).addClass('bg-primary/30').removeClass('bg-surface-container-high');
          $(this).find('div').addClass('bg-primary').removeClass('bg-on-surface-variant').css('right', '2px').css('left', 'auto');
        } else {
          $(this).removeClass('bg-primary/30').addClass('bg-surface-container-high');
          $(this).find('div').removeClass('bg-primary').addClass('bg-on-surface-variant').css('left', '2px').css('right', 'auto');
        }
      });

      // 启动生成
      $('#btn-start').on('click', function() {
        window.location.href = 'pipeline.html';
      });
    });
  </script>
</body>

</html>
