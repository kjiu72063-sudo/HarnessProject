<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #3B82F6;
      --color-primary-container:    #1E3A5F;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #0F1115;
      --color-surface-container-lowest:   #0F1115;
      --color-surface:                    #1A1D24;
      --color-surface-container:          #252830;
      --color-surface-container-high:     #2A2D35;
      --color-surface-container-highest:  #32363F;
      /* === 文字 === */
      --color-on-surface:           #FFFFFF;
      --color-on-surface-variant:   #9CA3AF;
      /* === 功能色 === */
      --color-success:  #10B981;
      --color-error:    #EF4444;
      --color-warning:  #F59E0B;
      /* === 边框 === */
      --color-outline:          #374151;
      --color-outline-variant:  #4B5563;
      /* === 圆角 — 工程级精准，直角为主 === */
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影（深色主题，opacity 0.12~0.2） === */
      --shadow-card:   0 2px 8px rgba(0,0,0,0.15);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.2);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.3);
      /* === 字体 === */
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件 -->
  <header class="bg-surface sticky top-0 z-40 h-14 flex items-center justify-between px-5 border-b border-outline/20">
    <div class="flex items-center gap-2.5">
      <i data-lucide="cpu" class="text-primary w-5 h-5"></i>
      <span class="font-bold text-base tracking-tight">Harness Platform</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs text-on-surface-variant font-mono">v0.1.0</span>
      <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center text-primary text-xs font-bold">初</div>
    </div>
  </header>

  <div class="flex" style="height: calc(100vh - 3.5rem)">
    <aside class="w-52 shrink-0 bg-surface border-r border-outline/20 overflow-y-auto">
      <div class="p-3 space-y-0.5">
        <a href="requirement.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="message-square-plus" class="w-4 h-4"></i>需求输入
        </a>
        <a href="pipeline.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="git-branch" class="w-4 h-4"></i>流程监控
        </a>
        <a href="constraints.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="shield-check" class="w-4 h-4"></i>约束配置
        </a>
        <a href="artifacts.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="package" class="w-4 h-4"></i>产物管理
        </a>
      </div>
    </aside>

    <!-- @main-content:start -->
    <main class="flex-1 min-w-0 overflow-y-auto bg-background p-6">
    </main>
    <!-- @main-content:end -->
  </div>
  <!-- @nav:end 导航组件 -->

  <script>lucide.createIcons();</script>
</body>

</html>
