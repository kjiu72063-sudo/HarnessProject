[project]
name = "harness-platform"
version = "0.1.0"
description = "Meta-application platform powered by Harness Engineering + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.1.0,<5.0.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "import-linter>=2.13",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server"]

[tool.coverage.run]
source = ["server"]
omit = ["**/__pycache__/**", "**/tests/**"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "\\.venv/"]

[tool.importlinter]
root_package = "server"

# ❌ Routes 不得直接 import Models（绕过 Service 层）
# ✅ FIX: 在 Service 层编排数据访问，Routes 只持有 Service 引用
# 📖 See: docs/architecture/boundaries.md
[[tool.importlinter.contracts]]
name = "Routes cannot import models directly"
type = "forbidden"
source_modules = ["server.routes"]
forbidden_modules = ["server.models"]

# ❌ Nodes 不得直接 import Routes（Node 只返回 State，不操作 HTTP 响应）
# ✅ FIX: Node 只返回 State，HTTP 响应由 routes 层处理
# 📖 See: docs/architecture/boundaries.md
[[tool.importlinter.contracts]]
name = "Nodes cannot import routes"
type = "forbidden"
source_modules = ["server.nodes"]
forbidden_modules = ["server.routes"]
